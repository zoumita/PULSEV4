<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PULSE — V4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;--bg:#05091a;--panel:#0b1230;--violet:#a98cff;--violet2:#d8ccff;--blue:#173f9b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{color:#fff}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:980px;margin:auto}
header{height:86px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px}.metric{text-align:left}.metric.r{text-align:right}.caption{font-size:10px;letter-spacing:2px;color:#8f9bc2;text-transform:uppercase}.value{font-size:25px;font-weight:850;line-height:1.15;font-variant-numeric:tabular-nums}.level{text-align:center;font-size:11px;letter-spacing:2px;color:var(--violet2)}
#game{position:relative;flex:1;min-height:0;margin-bottom:14px;border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1c2d61 0,#101b42 36%,#070d23 78%);box-shadow:inset 0 1px 0 #ffffff18,0 24px 70px #000c}
#game:before{content:"";position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#9d8cff 1px,transparent 1px),linear-gradient(90deg,#9d8cff 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle,#000,transparent 73%)}
#arena{position:absolute;inset:0}#message{position:absolute;z-index:8;left:0;right:0;top:17px;text-align:center;font-size:11px;letter-spacing:1.5px;color:#aeb9dc;pointer-events:none}
#start,#restart{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #ffffff30;border-radius:999px;padding:18px 40px;background:linear-gradient(135deg,#fff,#cfc4ff);color:#0a1025;font-size:15px;font-weight:900;letter-spacing:1.7px;box-shadow:0 15px 45px #0009;touch-action:manipulation}#start:active,#restart:active{transform:translate(-50%,-50%) scale(.95)}
.hidden{display:none!important}.bubble{position:absolute;border:0;border-radius:50%;padding:0;touch-action:manipulation;cursor:pointer;box-shadow:0 0 28px var(--glow),inset 6px 7px 16px #fff9;animation:appear .16s cubic-bezier(.2,.8,.2,1)}.bubble:after{content:"";position:absolute;inset:10%;border:1px solid #ffffff66;border-radius:50%}
@keyframes appear{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}@keyframes pop{to{transform:scale(1.65);opacity:0}}.bubble.pop{animation:pop .18s ease-out forwards;pointer-events:none}
.ring{position:absolute;border:2px solid #e8e0ff;border-radius:50%;pointer-events:none;animation:ring .34s ease-out forwards}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#eee7ff;pointer-events:none;animation:spark .34s ease-out forwards}@keyframes ring{to{transform:scale(2.2);opacity:0}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.bonus{position:absolute;z-index:10;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;box-shadow:0 0 35px #b9a4ff;animation:bonusIn .2s ease-out}.bonus:after{content:"";position:absolute;inset:-6px;border:1px solid #cfc4ff66;border-radius:50%;animation:spin 1s linear infinite}@keyframes bonusIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
#levelup{position:absolute;z-index:30;inset:0;display:grid;place-items:center;pointer-events:none;font-size:30px;font-weight:900;letter-spacing:3px;color:#e5deff;text-shadow:0 0 30px #a98cff;animation:levelUp .75s ease-out forwards}@keyframes levelUp{0%{opacity:0;transform:scale(.7)}25%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
#test{position:fixed;left:8px;bottom:8px;background:#111;color:#9f9;font:11px monospace;padding:6px;z-index:99;display:none}
</style></head>
<body><div id="app"><header><div class="metric"><div class="caption">Temps</div><div class="value" id="time">0.000 s</div></div><div class="level" id="level">NIVEAU 1</div><div class="metric r"><div class="caption">Score</div><div class="value" id="score">0</div></div></header><main id="game"><div id="arena"></div><div id="message">PRÊT ?</div><button id="start">DÉMARRER</button></main></div><div id="test"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),game=$("game"),arena=$("arena"),start=$("start"),time=$("time"),scoreEl=$("score"),levelEl=$("level"),message=$("message");
let playing=false,score=0,level=1,started=0,frame=0,combo=0,nextBonus=5,bonusCount=0,popCount=0,levelCount=0;
const colors=[260,275,245,220,290];
function clock(){if(!playing)return;time.textContent=((performance.now()-started)/1000).toFixed(3)+" s";frame=requestAnimationFrame(clock)}
function clearArena(){arena.querySelectorAll(".bubble,.bonus,.ring,.spark,#levelup").forEach(e=>e.remove())}
function setLevel(){level=Math.floor(score/10)+1;levelEl.textContent="NIVEAU "+level}
function fx(x,y,size){const r=document.createElement("div");r.className="ring";r.style.width=r.style.height=(size*.55)+"px";r.style.left=(x-size*.275)+"px";r.style.top=(y-size*.275)+"px";arena.appendChild(r);setTimeout(()=>r.remove(),360);for(let i=0;i<8;i++){const s=document.createElement("i");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";const a=i*Math.PI/4,d=28+Math.random()*24;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");arena.appendChild(s);setTimeout(()=>s.remove(),360)}}
function createBubble(){if(!playing)return;const b=document.createElement("button");b.type="button";b.className="bubble";const s=Math.max(48,Math.min(76,game.clientWidth*.115-(level-1)*2));const x=12+Math.random()*(game.clientWidth-s-24),y=54+Math.random()*(Math.max(80,game.clientHeight-s-70)),h=colors[Math.floor(Math.random()*colors.length)]+Math.floor(Math.random()*16-8);b.style.cssText+=`width:${s}px;height:${s}px;left:${x}px;top:${y}px;--glow:hsla(${h},100%,75%,.65);background:radial-gradient(circle at 30% 25%,#fff 0%,hsl(${h} 100% 83%) 15%,hsl(${h} 88% 60%) 60%,hsl(${h} 75% 35%) 100%)`;b.addEventListener("pointerdown",e=>{e.preventDefault();hitBubble(b,s)});arena.appendChild(b)}
function hitBubble(b,s){if(!playing||!b.isConnected)return;popCount++;score++;combo++;scoreEl.textContent=score;const gr=game.getBoundingClientRect(),br=b.getBoundingClientRect(),x=br.left-gr.left+s/2,y=br.top-gr.top+s/2;fx(x,y,s);b.classList.add("pop");setTimeout(()=>b.remove(),180);if(score%5===0)spawnBonus();if(score%10===0){levelCount++;setLevel();showLevelUp()}setTimeout(createBubble,70)}
function spawnBonus(){if(!playing||arena.querySelector(".bonus"))return;const z=document.createElement("button");z.className="bonus";z.type="button";z.textContent="+5";const s=58,x=18+Math.random()*(game.clientWidth-s-36),y=60+Math.random()*(Math.max(70,game.clientHeight-s-75));z.style.cssText=`width:${s}px;height:${s}px;left:${x}px;top:${y}px;background:radial-gradient(circle,#fff,#c9baff 25%,#8d72e8 65%,#4c3b99)`;z.addEventListener("pointerdown",e=>{e.preventDefault();if(!playing||!z.isConnected)return;bonusCount++;score+=5;combo+=2;scoreEl.textContent=score;fx(x+s/2,y+s/2,s);z.remove();message.textContent="BONUS +5 !";setTimeout(()=>{if(playing)message.textContent="TOUCHE LES PASTILLES !"},450);setTimeout(createBubble,70)});arena.appendChild(z)}
function showLevelUp(){const el=document.createElement("div");el.id="levelup";el.textContent="NIVEAU "+level;arena.appendChild(el);setTimeout(()=>el.remove(),800)}
function startGame(){playing=true;score=0;level=1;combo=0;bonusCount=0;popCount=0;levelCount=0;setLevel();scoreEl.textContent="0";time.textContent="0.000 s";clearArena();start.classList.add("hidden");message.textContent="TOUCHE LES PASTILLES !";started=performance.now();cancelAnimationFrame(frame);clock();for(let i=0;i<3;i++)createBubble()}
start.addEventListener("pointerdown",e=>{e.preventDefault();if(!playing)startGame()});
// Deterministic smoke test: run with ?test=1. It exercises two levels, bonus, pop FX and timer.
window.__PULSE_TEST__=async()=>{const out=$("test");out.style.display="block";startGame();await new Promise(r=>setTimeout(r,40));const first=arena.querySelector(".bubble");if(!first)throw Error("pastille initiale absente");hitBubble(first,Number.parseFloat(first.style.width));for(let i=0;i<9;i++){await new Promise(r=>setTimeout(r,5));const b=arena.querySelector(".bubble");if(!b)throw Error("pastille manquante niveau 1");hitBubble(b,Number.parseFloat(b.style.width))}await new Promise(r=>setTimeout(r,100));if(level<2)throw Error("niveau 2 non déclenché");const bonus=arena.querySelector(".bonus");if(!bonus)throw Error("bonus non activé");bonus.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true}));await new Promise(r=>setTimeout(r,80));if(bonusCount<1)throw Error("bonus non collecté");if(popCount<10)throw Error("animations de pop non déclenchées");if(!time.textContent.includes("."))throw Error("timer inactif");playing=false;cancelAnimationFrame(frame);out.textContent=`TEST OK — niveau:${level} pops:${popCount} bonus:${bonusCount} score:${score}`;setTimeout(()=>window.close(),50);return out.textContent};
if(new URLSearchParams(location.search).get("test")==="1")window.__PULSE_TEST__().catch(e=>{const out=$("test");out.style.display="block";out.textContent="TEST ÉCHEC — "+e.message;console.error(e);setTimeout(()=>window.close(),50)});
})();
</script></body></html>
